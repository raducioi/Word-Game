    <h2>🀄 4글자 이어말하기</h2>
    <div class="rules">
      • 4글자 단어(사자성어·유행어 등) 중 <b>앞 2글자</b>와 <b>카운트다운(3초)</b>을 보여줘요.<br />
      • 참가자들이 나머지 2글자를 <b>소리내어</b> 맞혀요.<br />
      • <b>화면을 터치</b>하면 정답이 공개돼요.<br />
      • <b>다시 터치</b>하면 다음 문제로 넘어가요.<br />
      • <b>종료</b>를 누를 때까지 계속됩니다.
    </div>
    <button class="btn-primary" id="startBtn">시작하기 ▶</button>
  </div>

    // ===== 시간·악기·기타 =====
    { w: "점심시간", h: "점심을 먹는 시간" },
    { w: "저녁시간", h: "저녁을 먹는 시간" },

    { w: "황금연휴", h: "길게 이어지는 연휴" },
    { w: "바이올린", h: "활로 켜는 현악기" },
    { w: "하모니카", h: "입으로 부는 작은 악기" },
    { w: "무지개색", h: "일곱 빛깔 무지개의 색" },
    { w: "인생네컷", h: "즉석 사진을 찍는 네 컷 사진" },
    { w: "내돈내산", h: "내 돈 주고 내가 산 것" },

  const TIME_LIMIT = 3;
  let phase = "idle"; // "counting" | "revealed"
  let current = null, count = 0, queue = [], countdownId = null;

  const $ = (id) => document.getElementById(id);
  const puzzleEl = $("puzzle"), hintEl = $("hint"), promptEl = $("prompt");
  const countdownEl = $("countdown"), timerBar = $("timerBar");

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function startGame() {
    initAudio();
    count = 0;
    queue = shuffle(WORDS);
    $("startScreen").classList.add("hidden");
    $("endScreen").classList.add("hidden");
    nextRound();
  }

  function nextRound() {
    phase = "counting";
    if (queue.length === 0) queue = shuffle(WORDS);
    current = queue.pop();
    count += 1;
    $("count").textContent = count;
    renderPuzzle(current.w, false);
    hintEl.textContent = ""; // 설명은 정답 공개 때만
    startCountdown();
  }

  function renderPuzzle(word, revealed) {
    puzzleEl.innerHTML = "";
    [...word].forEach((ch, i) => {
      const div = document.createElement("div");
      div.className = "tile";
      if (i < 2) { div.classList.add("shown"); div.textContent = ch; }
      else if (revealed) { div.classList.add("reveal"); div.textContent = ch; }
      else { div.classList.add("blank"); div.textContent = "?"; }
      puzzleEl.appendChild(div);
    });
  }

  function startCountdown() {
    clearInterval(countdownId);
    let remaining = TIME_LIMIT;
    countdownEl.className = "countdown";
    countdownEl.textContent = remaining;
    promptEl.textContent = "정답을 외쳐보세요! 🗣️";
    promptEl.className = "prompt";
    playTick();
    timerBar.classList.remove("running", "warn");
    timerBar.style.setProperty("--time", TIME_LIMIT + "s");
    void timerBar.offsetWidth;
    timerBar.classList.add("running");
    countdownId = setInterval(() => {
      remaining -= 1;
      if (remaining > 0) {
        countdownEl.textContent = remaining;
        playTick();
        if (remaining <= 1) timerBar.classList.add("warn");
      } else {
        clearInterval(countdownId);
        timerBar.classList.remove("running");
        countdownEl.classList.add("done");
        countdownEl.textContent = "⏰";
        promptEl.textContent = "화면을 눌러 정답 확인 👆";
        promptEl.className = "prompt pulse";
      }
    }, 1000);
  }

  function revealAnswer() {
    phase = "revealed";
    clearInterval(countdownId);
    playFanfare();
    timerBar.classList.remove("running", "warn");
    renderPuzzle(current.w, true);
    hintEl.textContent = "💡 " + current.h;
    countdownEl.className = "countdown reveal";
    countdownEl.textContent = current.w;
    promptEl.textContent = "화면을 눌러 다음 문제 👉";
    promptEl.className = "prompt pulse";
  }

  function handleTap() {
    if (phase === "counting") revealAnswer();
    else if (phase === "revealed") nextRound();
  }

  function endGame() {
    clearInterval(countdownId);
    phase = "idle";
    timerBar.classList.remove("running", "warn");
    $("finalCount").textContent = count;
    $("endScreen").classList.remove("hidden");
  }

  $("startBtn").addEventListener("click", startGame);
  $("restartBtn").addEventListener("click", startGame);
  $("quitBtn").addEventListener("click", (e) => { e.stopPropagation(); endGame(); });
  $("tapArea").addEventListener("click", handleTap);
  document.addEventListener("keydown", (e) => {
    if (phase === "idle") return;
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); handleTap(); }
  });
</script>
