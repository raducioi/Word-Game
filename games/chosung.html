  // ===== 초성 추출 =====
  const CHO = ["ㄱ","ㄲ","ㄴ","ㄷ","ㄸ","ㄹ","ㅁ","ㅂ","ㅃ","ㅅ","ㅆ","ㅇ","ㅈ","ㅉ","ㅊ","ㅋ","ㅌ","ㅍ","ㅎ"];
  function toChosung(str) {
    let out = "";
    for (const ch of str) {
      const code = ch.charCodeAt(0);
      if (code >= 0xAC00 && code <= 0xD7A3) {
        out += CHO[Math.floor((code - 0xAC00) / 588)];
      } else {
        out += ch; // 공백·숫자·영문·기호는 그대로
      }
    }
    return out;
  }

  let phase = "idle"; // "quiz" | "revealed"
  let current = null, count = 0, queue = [];

  const $ = (id) => document.getElementById(id);
  const chosungEl = $("chosung"), answerEl = $("answer"), promptEl = $("prompt"), catEl = $("catBadge");

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function startGame() {
    initAudio();
    count = 0;
    queue = shuffle(QUIZ);
    $("startScreen").classList.add("hidden");
    $("endScreen").classList.add("hidden");
    nextRound();
  }

  function nextRound() {
    phase = "quiz";
    if (queue.length === 0) queue = shuffle(QUIZ);
    current = queue.pop();
    count += 1;
    $("count").textContent = count;
    catEl.textContent = current.c;
    chosungEl.textContent = toChosung(current.a);
    answerEl.textContent = "";
    promptEl.textContent = "정답을 맞혀보세요! 🤔";
    promptEl.className = "prompt";
  }

  function revealAnswer() {
    phase = "revealed";
    playFanfare();
    answerEl.textContent = current.a;
    promptEl.textContent = "화면을 눌러 다음 문제 👉";
    promptEl.className = "prompt pulse";
  }

  function handleTap() {
    if (phase === "quiz") revealAnswer();
    else if (phase === "revealed") nextRound();
  }

  function endGame() {
    phase = "idle";
    $("finalCount").textContent = count;
    $("endScreen").classList.remove("hidden");
  }

  $("startBtn").addEventListener("click", startGame);
  $("restartBtn").addEventListener("click", startGame);
  $("quitBtn").addEventListener("click", (e) => { e.stopPropagation(); endGame(); });
  $("tapArea").addEventListener("click", handleTap);
  document.addEventListener("keydown", (e) => {
    if (phase === "idle") return;
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); handleTap(); }
  });
</script>
</body>
</html>
