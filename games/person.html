<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>인물 퀴즈 👤</title>
<link rel="stylesheet" href="../style.css" />
</head>
<body>
<div class="game">
  <a class="back" href="../index.html">← 메인</a>
  <h1>인물 퀴즈 👤</h1>
  <p class="subtitle">사진을 보고 누구인지 3초 안에 맞혀보세요!<br/>카운트다운 후 화면을 누르면 정답이 공개돼요.</p>

  <div class="hud">
    <div class="stat"><span class="label">문제</span><span class="value" id="count">0</span></div>
    <button class="btn-quit" id="quitBtn">종료</button>
  </div>

  <div class="timer-wrap"><div class="timer-bar" id="timerBar"></div></div>
  <div class="countdown" id="countdown"></div>

  <div class="tap-area" id="tapArea">
    <div class="photo-wrap" id="photo"></div>
    <div class="person-name" id="name"></div>
    <div class="person-desc" id="desc"></div>
    <div class="prompt" id="prompt"></div>
  </div>

  <p class="footer-note">사진 출처: 위키백과 · 진행자용 도우미 화면</p>

  <div class="overlay" id="startScreen">
    <h2>👤 인물 퀴즈</h2>
    <div class="rules">
      • <b>인물 사진</b>과 <b>카운트다운(3초)</b>을 보여줘요.<br />
      • 참가자들이 누구인지 <b>소리내어</b> 맞혀요.<br />
      • <b>화면을 터치</b>하면 정답(이름)이 공개돼요.<br />
      • <b>다시 터치</b>하면 다음 문제로 넘어가요.<br />
      • 사진은 위키백과에서 불러와요. <b>인터넷 연결</b>이 필요해요!
    </div>
    <button class="btn-primary" id="startBtn">시작하기 ▶</button>
  </div>

  <div class="overlay hidden" id="endScreen">
    <h2>수고하셨어요! 🎉</h2>
    <p>진행한 문제</p>
    <div class="big-score" id="finalCount">0</div>
    <button class="btn-primary" id="restartBtn">다시 시작 ↻</button>
  </div>
</div>

<script src="../sound.js"></script>
<script>
  // ===== 인물 데이터 =====
  // 문자열이면 이름=위키문서명이 같다는 뜻. 다르면 { name:"표시이름", wiki:"위키문서명" }.
  // 직접 사진을 쓰려면 { name, wiki, img:"이미지URL" } 로 지정 (위키 호출 대신 그 사진 사용).
  // ※ 사진은 한국어 위키백과에서 불러오며, 문서명이 다르거나 사진이 없는 인물은 자동으로 건너뜁니다.

    "스테판 커리", "펠레", "디에고 마라도나", "즐라탄 이브라히모비치", "세리나 윌리엄스",
    "마이크 타이슨", "에를링 홀란드", "케빈 더브라위너", "모하메드 살라", "해리 케인",
    // --- 한국 가수 ---
    "아이유", "임영웅", "싸이", "비", "보아", "태연", "지드래곤", "수지", "박효신",
    "이효리", "조용필", "나훈아", "이미자", "백지영", "이선희", "성시경", "윤도현",
    "장원영", "화사", "제니",
    // --- 해외 가수 ---
    "마이클 잭슨", "비욘세", "테일러 스위프트", "에드 시런", "아리아나 그란데",
    "저스틴 비버", "브루노 마스", "레이디 가가", "엘비스 프레슬리", "프레디 머큐리",
    "존 레논", "폴 매카트니", "밥 딜런", "마돈나", "리한나", "빌리 아일리시",
    "두아 리파", "셀린 디옹", "휘트니 휴스턴", "아델",
    // --- 한국 배우 ---
    "송강호", "이병헌", "마동석", "황정민", "최민식", "김혜수", "전지현", "손예진",
    "현빈", "공유", "이정재", "정우성", "김수현", "박서준", "이민호", "송중기",
    "하정우", "류준열", "김태리", "박은빈",
    // --- 해외 배우 ---
    "톰 크루즈", "레오나르도 디카프리오", "브래드 피트", "안젤리나 졸리", "조니 뎁",
    { name: "로버트 다우니 주니어", wiki: "로버트 다우니 주니어" }, "스칼릿 조핸슨",
    "키아누 리브스", "윌 스미스", "덴절 워싱턴", "모건 프리먼", "톰 행크스",
    "메릴 스트립", "엠마 왓슨", "드웨인 존슨", "휴 잭맨", "크리스 에반스",
    "갈 가도트", "호아킨 피닉스", "나탈리 포트만",
    // --- 코미디언 / 예능인 ---
    "유재석", "강호동", "신동엽", "박명수", "정준하", "노홍철", "하하", "김구라",
    "이수근", "김종국", "박나래", "김숙", "이경규", "서장훈", "양세형",
    // --- 만화 / 애니 캐릭터 ---
    "도라에몽", "피카츄", "호빵맨", { name: "둘리", wiki: "아기공룡 둘리" },
    { name: "뽀로로", wiki: "뽀롱뽀롱 뽀로로" }, { name: "짱구", wiki: "짱구는 못말려" },
    "미키 마우스", "헬로 키티", { name: "스폰지밥", wiki: "스폰지밥 네모바지" },
    { name: "마리오", wiki: "마리오 (가공 인물)" }, { name: "코난", wiki: "에도가와 코난" },
    { name: "나루토", wiki: "우즈마키 나루토" }, { name: "손오공", wiki: "손오공 (드래곤볼)" },
    { name: "루피", wiki: "몽키 D. 루피" }, "심슨 가족",
    // --- 영화 / 히어로 캐릭터 ---
    "아이언맨", { name: "배트맨", wiki: "배트맨" }, "슈퍼맨", "스파이더맨",
    "캡틴 아메리카", { name: "토르", wiki: "토르 (마블 시네마틱 유니버스)" }, "헐크",
    "다스 베이더", "요다", "해리 포터", { name: "조커", wiki: "조커 (만화)" },
    "간달프", "제임스 본드", "터미네이터", { name: "엘사", wiki: "엘사 (겨울왕국)" },
    // --- 한국 역사 인물 ---
    { name: "세종대왕", wiki: "세종" }, "이순신", "안중근", "유관순",
    { name: "김구", wiki: "김구" }, "신사임당", "정약용", "광개토대왕", "장영실",
    "윤봉길", "안창호", "김좌진", "을지문덕", "강감찬",
    { name: "이황", wiki: "이황" }, { name: "이이", wiki: "이이" }, "허준", "정조",
    "흥선대원군", "명성황후",
    // --- 세계 위인 ---
    { name: "아인슈타인", wiki: "알베르트 아인슈타인" }, { name: "뉴턴", wiki: "아이작 뉴턴" },
    { name: "다윈", wiki: "찰스 다윈" }, { name: "갈릴레이", wiki: "갈릴레오 갈릴레이" },
    { name: "레오나르도 다 빈치", wiki: "레오나르도 다 빈치" }, "미켈란젤로",
    { name: "모차르트", wiki: "볼프강 아마데우스 모차르트" }, { name: "베토벤", wiki: "루트비히 판 베토벤" },
    { name: "셰익스피어", wiki: "윌리엄 셰익스피어" }, { name: "나폴레옹", wiki: "나폴레옹 1세" },
    { name: "링컨", wiki: "에이브러햄 링컨" }, { name: "간디", wiki: "마하트마 간디" },
    { name: "마틴 루터 킹", wiki: "마틴 루서 킹 주니어" }, { name: "만델라", wiki: "넬슨 만델라" },
    { name: "처칠", wiki: "윈스턴 처칠" }, "클레오파트라",
    { name: "콜럼버스", wiki: "크리스토퍼 콜럼버스" }, "마리 퀴리", "스티브 잡스", "빌 게이츠",
  ];
  // 문자열/객체 정규화
  const ALL_PEOPLE = PEOPLE.map((p) => (typeof p === "string" ? { name: p, wiki: p } : p));

  const TIME_LIMIT = 3;
  let phase = "idle"; // "loading" | "counting" | "revealed"
  let current = null, count = 0, queue = [], countdownId = null, failStreak = 0;

  const $ = (id) => document.getElementById(id);
  const photoEl = $("photo"), nameEl = $("name"), descEl = $("desc");
  const promptEl = $("prompt"), countdownEl = $("countdown"), timerBar = $("timerBar");

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function startGame() {
    initAudio();
    count = 0; failStreak = 0;
    queue = shuffle(ALL_PEOPLE);
    $("startScreen").classList.add("hidden");
    $("endScreen").classList.add("hidden");
    nextRound();
  }

  function nextRound() {
    phase = "loading";
    if (queue.length === 0) queue = shuffle(ALL_PEOPLE);
    current = queue.pop();
    photoEl.innerHTML = '<div class="spinner"></div>';
    nameEl.textContent = "";
    descEl.textContent = "";
    countdownEl.className = "countdown";
    countdownEl.textContent = "";
    promptEl.textContent = "사진 불러오는 중…";
    promptEl.className = "prompt";
    timerBar.classList.remove("running", "warn");
    loadPhoto(current);
  }

  async function loadPhoto(person) {
    let url = person.img || "";
    let desc = person.desc || "";
    if (!url) {
      try {
        const res = await fetch("https://ko.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(person.wiki));
        if (res.ok) {
          const data = await res.json();
          url = (data.originalimage && data.originalimage.source) ||
                (data.thumbnail && data.thumbnail.source) || "";
          if (!desc) desc = data.description || "";
        }
      } catch (e) { url = ""; }
    }
    if (current !== person) return;        // 그 사이 다음 문제로 넘어갔으면 무시
    if (!url) { handleLoadFail(person); return; }

    person._desc = desc;
    const img = new Image();
    img.alt = "인물 사진";
    img.onload = () => {
      if (current !== person) return;
      photoEl.innerHTML = "";
      photoEl.appendChild(img);
      failStreak = 0;
      startCountdown();
    };
    img.onerror = () => { if (current === person) handleLoadFail(person); };
    img.src = url;
  }

  function handleLoadFail(person) {
    failStreak += 1;
    if (failStreak > 5) {
      photoEl.innerHTML = '<div class="photo-loading">😢</div>';
      promptEl.textContent = "사진을 불러올 수 없어요. 인터넷 연결을 확인해 주세요.";
      promptEl.className = "prompt";
      phase = "idle";
      return;
    }
    nextRound(); // 사진 없는 인물은 건너뛰고 다음으로
  }

  function startCountdown() {
    phase = "counting";
    count += 1;
    $("count").textContent = count;
    let remaining = TIME_LIMIT;
    countdownEl.className = "countdown";
    countdownEl.textContent = remaining;
    promptEl.textContent = "누구일까요? 🤔";
    promptEl.className = "prompt";
    playTick();
    timerBar.classList.remove("running", "warn");
    timerBar.style.setProperty("--time", TIME_LIMIT + "s");
    void timerBar.offsetWidth;
    timerBar.classList.add("running");
    countdownId = setInterval(() => {
      remaining -= 1;
      if (remaining > 0) {
        countdownEl.textContent = remaining;
        playTick();
        if (remaining <= 1) timerBar.classList.add("warn");
      } else {
        clearInterval(countdownId);
        timerBar.classList.remove("running");
        countdownEl.classList.add("done");
        countdownEl.textContent = "⏰";
        promptEl.textContent = "화면을 눌러 정답 확인 👆";
        promptEl.className = "prompt pulse";
      }
    }, 1000);
  }

  function revealAnswer() {
    phase = "revealed";
    clearInterval(countdownId);
    playFanfare();
    timerBar.classList.remove("running", "warn");
    countdownEl.className = "countdown reveal";
    countdownEl.textContent = "✅";
    nameEl.textContent = current.name;
    descEl.textContent = current._desc || "";
    promptEl.textContent = "화면을 눌러 다음 문제 👉";
    promptEl.className = "prompt pulse";
  }

  function handleTap() {
    if (phase === "counting") revealAnswer();
    else if (phase === "revealed") nextRound();
  }

  function endGame() {
    clearInterval(countdownId);
    phase = "idle";
    timerBar.classList.remove("running", "warn");
    $("finalCount").textContent = count;
    $("endScreen").classList.remove("hidden");
  }

  $("startBtn").addEventListener("click", startGame);
  $("restartBtn").addEventListener("click", startGame);
  $("quitBtn").addEventListener("click", (e) => { e.stopPropagation(); endGame(); });
  $("tapArea").addEventListener("click", handleTap);
  document.addEventListener("keydown", (e) => {
    if (phase === "idle" || phase === "loading") return;
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); handleTap(); }
  });
</script>
</body>
</html>
