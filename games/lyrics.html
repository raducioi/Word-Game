<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>가사 퀴즈 🎤</title>
<link rel="stylesheet" href="../style.css" />
</head>
<body>
<div class="game">
  <a class="back" href="../index.html">← 메인</a>
  <h1>가사 퀴즈 🎤</h1>
  <p class="subtitle">가사 한 소절을 보고 노래 제목을 맞혀보세요!<br/>모르면 소절을 더 보고, 그래도 모르면 가수를 확인해요.</p>

  <div class="hud">
    <div class="stat"><span class="label">문제</span><span class="value" id="count">0</span></div>
    <button class="btn-quit" id="quitBtn">종료</button>
  </div>

  <div class="step-label" id="stepLabel"></div>

  <div class="lyric-box" id="lyricBox"></div>
  <div class="reveal-artist hidden" id="artist"></div>
  <div class="answer-text" id="answer"></div>
  <div class="prompt" id="prompt"></div>

  <div class="action-col">
    <button class="btn-primary" id="mainBtn">다른 소절 보기</button>
    <button class="btn-hint" id="revealBtn">정답 바로 보기</button>
  </div>

  <p class="footer-note">진행자용 도우미 화면 · 종료를 누를 때까지 계속됩니다</p>

  <div class="overlay" id="startScreen">
    <h2>🎤 가사 퀴즈</h2>
    <div class="rules">
      • <b>가사 한 소절</b>을 보여줘요.<br />
      • 모르면 <b>다른 소절 보기</b>로 소절을 더 봐요. (최대 3개)<br />
      • 그래도 모르면 <b>가수</b>를 알려줘요.<br />
      • 마지막에 <b>정답(제목)</b>이 공개돼요.<br />
      • <b>타이머는 없어요!</b>
    </div>
    <button class="btn-primary" id="startBtn">시작하기 ▶</button>
  </div>

  <div class="overlay hidden" id="endScreen">
    <h2>수고하셨어요! 🎉</h2>
    <p>진행한 문제</p>
    <div class="big-score" id="finalCount">0</div>
    <button class="btn-primary" id="restartBtn">다시 시작 ↻</button>
  </div>
</div>

<script src="../sound.js"></script>
<script>
  // =====================================================================
  // ⚠️ 가사는 저작권 보호 대상입니다(한 줄도 포함).
  //    아래는 "형식 예시(템플릿)"이며, 실제 가사는 직접 입력해 사용하세요.
  //    노래마다 lines 에 소절을 1~3개 넣으면 됩니다(최대 3개 권장).
  //
  //    { title: "노래 제목", artist: "가수",
  //      lines: ["첫 소절", "둘째 소절", "셋째 소절"] }
  // =====================================================================
  const SONGS = [
    { title: "(노래 제목 1)", artist: "(가수 1)",
      lines: ["여기에 첫 번째 소절을 입력", "여기에 두 번째 소절을 입력", "여기에 세 번째 소절을 입력"] },
    { title: "(노래 제목 2)", artist: "(가수 2)",
      lines: ["첫 번째 소절", "두 번째 소절"] },
    { title: "(노래 제목 3)", artist: "(가수 3)",
      lines: ["이 노래는 소절이 하나만 등록된 예시"] },
  ];

  // ===== 상태 =====
  // phase: "lines"(소절 단계) | "artist"(가수 공개) | "answer"(정답 공개)
  let phase = "idle";
  let current = null, count = 0, queue = [];
  let shown = 1, total = 1; // 현재 보여준 소절 수 / 이 곡의 소절 수

  const $ = (id) => document.getElementById(id);
  const lyricBox = $("lyricBox"), artistEl = $("artist"), answerEl = $("answer");
  const promptEl = $("prompt"), stepLabel = $("stepLabel");
  const mainBtn = $("mainBtn"), revealBtn = $("revealBtn");

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function startGame() {
    initAudio();
    count = 0;
    queue = shuffle(SONGS);
    $("startScreen").classList.add("hidden");
    $("endScreen").classList.add("hidden");
    nextRound();
  }

  function nextRound() {
    if (queue.length === 0) queue = shuffle(SONGS);
    current = queue.pop();
    total = Math.max(1, current.lines.length);
    shown = 1;
    phase = "lines";
    count += 1;
    $("count").textContent = count;
    artistEl.classList.add("hidden");
    artistEl.textContent = "";
    answerEl.textContent = "";
    revealBtn.classList.remove("hidden");
    render();
  }

  function render() {
    // 누적 소절 표시
    lyricBox.innerHTML = "";
    for (let i = 0; i < shown; i++) {
      const div = document.createElement("div");
      div.className = "lyric-line";
      div.textContent = "♪ " + current.lines[i];
      lyricBox.appendChild(div);
    }
    if (phase === "lines") {
      stepLabel.textContent = "소절 " + shown + " / " + total;
      promptEl.textContent = "노래 제목은? 🎵";
      promptEl.className = "prompt";
      mainBtn.textContent = (shown < total)
        ? "다른 소절 보기 (" + shown + "/" + total + ")"
        : "가수 힌트 보기 🎙️";
    } else if (phase === "artist") {
      stepLabel.textContent = "가수 공개";
      artistEl.classList.remove("hidden");
      artistEl.textContent = "🎙️ " + current.artist;
      promptEl.textContent = "이제 제목을 맞혀보세요!";
      promptEl.className = "prompt";
      mainBtn.textContent = "정답 공개 ✅";
    } else if (phase === "answer") {
      stepLabel.textContent = "정답";
      artistEl.classList.remove("hidden");
      artistEl.textContent = "🎙️ " + current.artist;
      answerEl.textContent = "🎶 " + current.title;
      promptEl.textContent = "다음 문제로 넘어가요 👉";
      promptEl.className = "prompt pulse";
      mainBtn.textContent = "다음 문제 👉";
      revealBtn.classList.add("hidden");
    }
  }

  function mainAction() {
    if (phase === "lines") {
      if (shown < total) { shown += 1; render(); }
      else { phase = "artist"; render(); }
    } else if (phase === "artist") {
      phase = "answer"; playFanfare(); render();
    } else if (phase === "answer") {
      nextRound();
    }
  }

  function revealNow() {
    if (phase === "answer") return;
    shown = total;
    phase = "answer";
    playFanfare();
    render();
  }

  function endGame() {
    phase = "idle";
    $("finalCount").textContent = count;
    $("endScreen").classList.remove("hidden");
  }

  $("startBtn").addEventListener("click", startGame);
  $("restartBtn").addEventListener("click", startGame);
  $("quitBtn").addEventListener("click", (e) => { e.stopPropagation(); endGame(); });
  mainBtn.addEventListener("click", (e) => { e.stopPropagation(); mainAction(); });
  revealBtn.addEventListener("click", (e) => { e.stopPropagation(); revealNow(); });
  document.addEventListener("keydown", (e) => {
    if (phase === "idle") return;
    if (e.target && e.target.tagName === "BUTTON") return;
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); mainAction(); }
  });
</script>
</body>
</html>
