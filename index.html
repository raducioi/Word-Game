<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>4글자 이어말하기 ⏱️</title>
<style>
  :root {
    --bg: #0f1226;
    --bg2: #1a1f3c;
    --card: #232a52;
    --accent: #ffd166;
    --accent2: #06d6a0;
    --danger: #ef476f;
    --text: #f4f6ff;
    --muted: #9aa3c7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    background: radial-gradient(circle at 50% 0%, var(--bg2), var(--bg) 70%);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  .game {
    width: 100%;
    max-width: 480px;
    background: var(--card);
    border-radius: 24px;
    padding: 24px 24px 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,.45);
    position: relative;
    overflow: hidden;
  }
  h1 {
    font-size: 1.35rem;
    text-align: center;
    margin-bottom: 4px;
    letter-spacing: -.5px;
  }
  .subtitle {
    text-align: center;
    color: var(--muted);
    font-size: .82rem;
    margin-bottom: 16px;
    line-height: 1.5;
  }

  /* 상단 상태바 */
  .hud {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
    font-size: .95rem;
  }
  .hud .stat { display: flex; flex-direction: column; gap: 2px; }
  .hud .stat .label { color: var(--muted); font-size: .7rem; }
  .hud .stat .value { font-weight: 700; font-size: 1.1rem; }
  .btn-quit {
    padding: 8px 16px;
    background: rgba(239,71,111,.15);
    color: var(--danger);
    font-size: .85rem;
    border: 1px solid rgba(239,71,111,.4);
  }
  .btn-quit:hover { filter: brightness(1.1); }

  /* 타이머 바 */
  .timer-wrap {
    height: 10px;
    background: rgba(255,255,255,.08);
    border-radius: 99px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .timer-bar {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    border-radius: 99px;
  }
  .timer-bar.running {
    animation: drain var(--time, 3s) linear forwards;
  }
  @keyframes drain { from { width: 100%; } to { width: 0%; } }
  .timer-bar.warn { background: linear-gradient(90deg, var(--danger), var(--accent)); }

  /* 큰 카운트다운 숫자 */
  .countdown {
    text-align: center;
    font-size: 2.4rem;
    font-weight: 800;
    height: 1.3em;
    line-height: 1.3em;
    color: var(--accent);
    transition: color .2s ease;
  }
  .countdown.done { color: var(--danger); }
  .countdown.reveal { color: var(--accent2); }

  /* 터치 영역 (문제 + 정답 표시) */
  .tap-area {
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    border-radius: 16px;
    padding: 4px 0 10px;
    transition: background .15s ease;
  }
  .tap-area:active { background: rgba(255,255,255,.03); }

  /* 문제 영역 */
  .puzzle {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 10px 0 6px;
  }
  .tile {
    width: 64px;
    height: 76px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.3rem;
    font-weight: 800;
  }
  .tile.shown {
    background: linear-gradient(160deg, #2f3a73, #283063);
    color: var(--text);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.06);
  }
  .tile.blank {
    background: rgba(255,255,255,.05);
    color: var(--accent);
    border: 2px dashed rgba(255,209,102,.5);
  }
  .tile.reveal { background: var(--accent2); color: #06301f; border: none; }

  .hint {
    text-align: center;
    color: var(--muted);
    font-size: .92rem;
    min-height: 1.2em;
    margin: 12px 0 6px;
    padding: 0 8px;
  }

  .prompt {
    text-align: center;
    color: var(--text);
    font-size: .95rem;
    font-weight: 700;
    min-height: 1.4em;
    margin-top: 8px;
  }
  .prompt.pulse { animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }

  button {
    font-family: inherit;
    cursor: pointer;
    border: none;
    border-radius: 12px;
    font-weight: 700;
    transition: transform .08s ease, filter .15s ease;
  }
  button:active { transform: scale(.96); }
  .btn-primary {
    padding: 14px 24px;
    background: var(--accent);
    color: #2a2300;
    font-size: 1rem;
  }
  .btn-primary:hover { filter: brightness(1.05); }

  .footer-note { text-align:center; color: var(--muted); font-size:.72rem; margin-top:16px; }

  /* 시작 / 종료 오버레이 */
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(15,18,38,.94);
    backdrop-filter: blur(4px);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    text-align: center;
    padding: 30px;
    z-index: 5;
  }
  .overlay.hidden { display: none; }
  .overlay h2 { font-size: 1.8rem; }
  .overlay p { color: var(--muted); line-height: 1.6; }
  .overlay .big-score { font-size: 3rem; font-weight: 800; color: var(--accent); }
  .rules {
    text-align: left;
    background: rgba(255,255,255,.05);
    padding: 14px 18px;
    border-radius: 12px;
    font-size: .9rem;
    color: var(--text);
    line-height: 1.7;
  }
  .rules b { color: var(--accent); }
</style>
</head>
<body>
<div class="game">
  <h1>4글자 이어말하기 ⏱️</h1>
  <p class="subtitle">앞 두 글자를 보고 정답을 외쳐보세요!<br/>카운트다운 후 화면을 누르면 정답이 공개돼요.</p>

  <div class="hud">
    <div class="stat"><span class="label">문제</span><span class="value" id="count">0</span></div>
    <button class="btn-quit" id="quitBtn">종료</button>
  </div>

  <div class="timer-wrap"><div class="timer-bar" id="timerBar"></div></div>
  <div class="countdown" id="countdown"></div>

  <div class="tap-area" id="tapArea">
    <div class="puzzle" id="puzzle"></div>
    <div class="hint" id="hint"></div>
    <div class="prompt" id="prompt"></div>
  </div>

  <p class="footer-note">진행자용 도우미 화면 · 종료를 누를 때까지 계속됩니다</p>

  <!-- 시작 화면 -->
  <div class="overlay" id="startScreen">
    <h2>🀄 4글자 이어말하기</h2>
    <div class="rules">
      • 4글자 단어(사자성어·유행어 등) 중 <b>앞 2글자</b>와 <b>카운트다운(3초)</b>을 보여줘요.<br />
      • 참가자들이 나머지 2글자를 <b>소리내어</b> 맞혀요.<br />
      • <b>화면을 터치</b>하면 정답이 공개돼요.<br />
      • <b>다시 터치</b>하면 다음 문제로 넘어가요.<br />
      • <b>종료</b>를 누를 때까지 계속됩니다.
    </div>
    <button class="btn-primary" id="startBtn">시작하기 ▶</button>
  </div>

  <!-- 종료 화면 -->
  <div class="overlay hidden" id="endScreen">
    <h2>수고하셨어요! 🎉</h2>
    <p>진행한 문제</p>
    <div class="big-score" id="finalCount">0</div>
    <button class="btn-primary" id="restartBtn">다시 시작 ↻</button>
  </div>
</div>

<script>
  // ===== 단어 데이터 (4글자 사자성어 + 뜻) =====
  const WORDS = [
    { w: "유비무환", h: "미리 준비가 되어 있으면 근심이 없음" },
    { w: "동고동락", h: "괴로움도 즐거움도 함께함" },
    { w: "일석이조", h: "한 가지 일로 두 가지 이득" },
    { w: "고진감래", h: "고생 끝에 즐거움이 옴" },
    { w: "작심삼일", h: "결심이 사흘을 못 감" },
    { w: "십중팔구", h: "열 중 여덟아홉, 거의 대부분" },
    { w: "안하무인", h: "눈 아래에 사람이 없듯 교만함" },
    { w: "어부지리", h: "둘이 다투는 사이 제삼자가 이득" },
    { w: "유유상종", h: "비슷한 것끼리 서로 어울림" },
    { w: "자업자득", h: "자기가 한 일의 결과를 자기가 받음" },
    { w: "조삼모사", h: "잔꾀로 남을 속임" },
    { w: "타산지석", h: "남의 잘못도 나의 교훈이 됨" },
    { w: "결초보은", h: "죽어서도 은혜를 갚음" },
    { w: "과유불급", h: "지나침은 미치지 못함과 같음" },
    { w: "금시초문", h: "이제야 처음 들음" },
    { w: "다다익선", h: "많으면 많을수록 좋음" },
    { w: "대기만성", h: "큰 그릇은 늦게 이루어짐" },
    { w: "동문서답", h: "물음과 전혀 상관없는 엉뚱한 대답" },
    { w: "마이동풍", h: "남의 말을 귀담아듣지 않음" },
    { w: "백전백승", h: "싸울 때마다 모두 이김" },
    { w: "사면초가", h: "사방이 적으로 둘러싸인 곤경" },
    { w: "설상가상", h: "어려운 일이 겹쳐 일어남" },
    { w: "오리무중", h: "갈피를 잡을 수 없음" },
    { w: "우유부단", h: "결단을 내리지 못하고 망설임" },
    { w: "이심전심", h: "마음과 마음으로 서로 통함" },
    { w: "인과응보", h: "원인에 따라 결과가 따름" },
    { w: "일사천리", h: "일이 거침없이 빠르게 진행됨" },
    { w: "전화위복", h: "화가 바뀌어 복이 됨" },
    { w: "주마간산", h: "대충 훑어봄" },
    { w: "천고마비", h: "하늘은 높고 말은 살찌는 가을" },
    { w: "청출어람", h: "제자가 스승보다 나음" },
    { w: "탁상공론", h: "현실성 없는 헛된 논의" },
    { w: "표리부동", h: "겉과 속이 다름" },
    { w: "팔방미인", h: "여러 방면에 능통한 사람" },
    { w: "함흥차사", h: "심부름 간 사람이 소식이 없음" },
    { w: "형설지공", h: "고생하며 부지런히 공부함" },
    { w: "호시탐탐", h: "기회를 노리며 형세를 살핌" },
    { w: "화룡점정", h: "가장 중요한 부분을 마무리함" },
    { w: "감언이설", h: "남의 비위를 맞추는 달콤한 말" },
    { w: "권선징악", h: "선을 권하고 악을 벌함" },
    { w: "기상천외", h: "착상이 보통을 뛰어넘어 기발함" },
    { w: "노심초사", h: "몹시 마음을 쓰며 애를 태움" },
    { w: "박장대소", h: "손뼉을 치며 크게 웃음" },
    { w: "산전수전", h: "온갖 어려움을 다 겪음" },
    { w: "속수무책", h: "어찌할 도리 없이 손을 묶음" },
    { w: "시시각각", h: "시간이 흐름에 따라 그때그때" },
    { w: "우왕좌왕", h: "이리저리 헤매며 갈팡질팡함" },
    { w: "일취월장", h: "나날이 발전함" },
    { w: "임기응변", h: "상황에 맞춰 그때그때 처리함" },

    // ===== 요즘 유행어 / 신조어 =====
    { w: "만반잘부", h: "'만나서 반가워 잘 부탁해'의 줄임말" },
    { w: "어쩔티비", h: "'어쩌라고'를 받아치는 유행어" },
    { w: "저쩔티비", h: "'어쩔티비'에 되받아치는 말" },
    { w: "럭키비키", h: "불운도 행운으로 여기는 초긍정 마인드 (장원영)" },
    { w: "폼미쳤다", h: "실력·컨디션이 최고조일 때 쓰는 말" },
    { w: "반박불가", h: "반박할 수 없을 만큼 맞는 말" },
    { w: "갓생살기", h: "부지런하고 알차게 사는 삶" },
    { w: "킹받는다", h: "몹시 열받는다 ('킹'+받다)" },
    { w: "가성비갑", h: "가격 대비 성능이 최고라는 뜻" },
    { w: "낄끼빠빠", h: "'낄 때 끼고 빠질 때 빠져라'" },

    // ===== 요즘 인기 단어 (음식·문화·기술) =====
    { w: "마라샹궈", h: "얼얼하게 매운 중국식 볶음 요리" },
    { w: "양념치킨", h: "달콤·매콤 양념을 입힌 치킨" },
    { w: "김치찌개", h: "김치로 끓인 한국 대표 찌개" },
    { w: "부대찌개", h: "햄·소시지를 넣어 끓인 찌개" },
    { w: "비빔냉면", h: "매콤하게 비벼 먹는 여름 별미" },
    { w: "인공지능", h: "사람처럼 학습·판단하는 기술 (AI)" },
    { w: "메타버스", h: "3차원 가상 세계 플랫폼" },
    { w: "스마트폰", h: "손안의 만능 기기" },
    { w: "무한도전", h: "국민 예능으로 사랑받은 장수 프로그램" },
    { w: "주말여행", h: "주말을 이용해 떠나는 짧은 여행" },
  ];

  // ===== 상태 =====
  const TIME_LIMIT = 3; // 초
  let phase = "idle"; // "counting" | "revealed"
  let current = null;
  let count = 0;
  let queue = [];
  let countdownId = null;

  // ===== DOM =====
  const $ = (id) => document.getElementById(id);
  const puzzleEl = $("puzzle");
  const hintEl = $("hint");
  const promptEl = $("prompt");
  const countdownEl = $("countdown");
  const timerBar = $("timerBar");

  // ===== 유틸 =====
  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // ===== 게임 흐름 =====
  function startGame() {
    count = 0;
    queue = shuffle(WORDS);
    $("startScreen").classList.add("hidden");
    $("endScreen").classList.add("hidden");
    nextRound();
  }

  function nextRound() {
    phase = "counting";
    if (queue.length === 0) queue = shuffle(WORDS); // 다 풀면 다시 섞어서 무한
    current = queue.pop();
    count += 1;
    $("count").textContent = count;
    renderPuzzle(current.w, false);
    hintEl.textContent = ""; // 설명은 정답 공개 때만 보여줌
    startCountdown();
  }

  function renderPuzzle(word, revealed) {
    puzzleEl.innerHTML = "";
    [...word].forEach((ch, i) => {
      const div = document.createElement("div");
      div.className = "tile";
      if (i < 2) {
        div.classList.add("shown");
        div.textContent = ch;
      } else if (revealed) {
        div.classList.add("reveal");
        div.textContent = ch;
      } else {
        div.classList.add("blank");
        div.textContent = "?";
      }
      puzzleEl.appendChild(div); // ★ 이 줄을 빼면 타일이 안 보임 (과거 버그)
    });
  }

  function startCountdown() {
    clearInterval(countdownId);
    let remaining = TIME_LIMIT;
    countdownEl.className = "countdown";
    countdownEl.textContent = remaining;
    promptEl.textContent = "정답을 외쳐보세요! 🗣️";
    promptEl.className = "prompt";

    // 타이머 바 리셋 후 애니메이션 재시작
    timerBar.classList.remove("running", "warn");
    timerBar.style.setProperty("--time", TIME_LIMIT + "s");
    void timerBar.offsetWidth; // reflow로 애니메이션 리셋
    timerBar.classList.add("running");

    countdownId = setInterval(() => {
      remaining -= 1;
      if (remaining > 0) {
        countdownEl.textContent = remaining;
        if (remaining <= 1) timerBar.classList.add("warn");
      } else {
        clearInterval(countdownId);
        timerBar.classList.remove("running");
        countdownEl.classList.add("done");
        countdownEl.textContent = "⏰";
        promptEl.textContent = "화면을 눌러 정답 확인 👆";
        promptEl.className = "prompt pulse";
      }
    }, 1000);
  }

  function revealAnswer() {
    phase = "revealed";
    clearInterval(countdownId);
    timerBar.classList.remove("running", "warn");
    renderPuzzle(current.w, true);
    hintEl.textContent = "💡 " + current.h; // 정답과 함께 설명 표시
    countdownEl.className = "countdown reveal";
    countdownEl.textContent = current.w;
    promptEl.textContent = "화면을 눌러 다음 문제 👉";
    promptEl.className = "prompt pulse";
  }

  function handleTap() {
    if (phase === "counting") revealAnswer();
    else if (phase === "revealed") nextRound();
  }

  function endGame() {
    clearInterval(countdownId);
    phase = "idle";
    timerBar.classList.remove("running", "warn");
    $("finalCount").textContent = count;
    $("endScreen").classList.remove("hidden");
  }

  // ===== 이벤트 =====
  $("startBtn").addEventListener("click", startGame);
  $("restartBtn").addEventListener("click", startGame);
  $("quitBtn").addEventListener("click", (e) => { e.stopPropagation(); endGame(); });
  $("tapArea").addEventListener("click", handleTap);
  // 데스크톱/리모컨 편의: 스페이스·엔터로도 진행
  document.addEventListener("keydown", (e) => {
    if (phase === "idle") return;
    if (e.key === " " || e.key === "Enter") { e.preventDefault(); handleTap(); }
  });
</script>
</body>
</html>
